version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: relationships_psychology_db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relationships_psychology
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
